
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Você decide sua carreira no Futebol</title>
    <link rel="stylesheet" href="./style.css">
    <script type="module" src="./script.js"></script>
</head>
<body>
    <main class="caixa-principal">
        <h1>Você decide sua carreira no Futebol ⚽</h1>

        <p class="introducao">
            Responda às perguntas e descubra seu perfil no futebol!
        </p>

        <button class="iniciar-btn">Iniciar jogo</button>

        <section class="jogo" hidden>
            <p class="progresso"></p>
            <div class="caixa-perguntas"></div>
            <div class="caixa-alternativas"></div>
        </section>

        <section class="caixa-resultado" hidden>
            <h2 class="titulo-resultado">Seu resultado</h2>
            <p class="texto-resultado"></p>
            <button class="novamente-btn">Jogar novamente</button>
        </section>
    </main>
</body>
</html>
